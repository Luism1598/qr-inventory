<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cff">
<title>QR Inventory</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--blue:#0b5cff;--dark:#102033;--muted:#64748b;--line:#dbe3ee;--bg:#f5f7fb;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--dark)}
header{background:var(--blue);color:#fff;padding:18px 16px;font-size:21px;font-weight:700}
main{max-width:760px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
button,input,textarea{font:inherit}button{min-height:46px;border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:white}.secondary{background:#eef3fb;color:var(--dark)}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:6px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0}
#cameraBox{width:100%;margin:12px 0;border-radius:14px;overflow:hidden;background:#111;min-height:340px} #video{width:100%;min-height:340px;background:#111;overflow:hidden} #video video{width:100%!important;height:340px!important;display:block!important;object-fit:cover!important;background:#111!important} #video__scan_region{min-height:340px!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.value{font-weight:700;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:13px}.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}.actions{display:flex;flex-wrap:wrap;gap:8px}.success{padding:10px;border-radius:10px;background:#eaf8ee;color:#176b32;font-weight:700}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>QR INVENTORY</header>
<main>
<section class="card">
  <h2>Scan Inventory</h2>
  <p class="muted">Point your phone camera at a QR code. The app extracts your part information automatically.</p>
  <div id="cameraBox" class="hidden"><div id="video"></div></div>
  <div class="actions">
    <button id="start" class="primary">📷 Start Camera</button>
    <button id="stop" class="secondary hidden">Stop Camera</button>
  </div>
  <p id="cameraMsg" class="muted"></p>
  <label>QR value (manual fallback)
    <textarea id="raw" rows="3" placeholder="K108575#P1021-0150#Q305#9D2329#1T2329#1VYAGEO#1P1021-0150"></textarea>
  </label>
  <button id="read" class="primary">Read QR Data</button>
</section>

<section id="details" class="card hidden">
  <h2>Scan Result</h2>
  <div class="grid">
    <div><span class="muted">Internal ID</span><div id="internalId" class="value">—</div></div>
    <div><span class="muted">Part Number</span><div id="partNumber" class="value">—</div></div>
    <div><span class="muted">Quantity</span><div id="qty" class="value">—</div></div>
    <div><span class="muted">Date Code</span><div id="dateCode" class="value">—</div></div>
    <div><span class="muted">Lot</span><div id="lot" class="value">—</div></div>
    <div><span class="muted">Manufacturer</span><div id="manufacturer" class="value">—</div></div>
  </div>
  <label>Location *
    <input id="location" placeholder="Example: A-01-03" autocomplete="off">
  </label>
  <label>Notes
    <input id="notes" placeholder="Optional">
  </label>
  <div class="actions">
    <button id="save" class="primary">💾 Save Inventory</button>
    <button id="next" class="secondary">📷 Scan Next</button>
  </div>
</section>

<section class="card">
  <h2>Inventory History</h2>
  <div class="actions">
    <button id="export" class="primary">📊 Export Excel</button>
    <button id="clear" class="secondary">Clear History</button>
  </div>
  <p id="count" class="muted">0 scans</p>
  <div id="empty" class="muted">No scans saved yet.</div>
  <div id="history" class="scroll hidden">
    <table><thead><tr><th>Date/Time</th><th>Part</th><th>Qty</th><th>Location</th><th>Manufacturer</th></tr></thead>
    <tbody id="rows"></tbody></table>
  </div>
</section>
</main>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
const TEST='K108575#P1021-0150#Q305#9D2329#1T2329#1VYAGEO#1P1021-0150';
let scans=JSON.parse(localStorage.getItem('qrInventoryScans')||'[]');
let current=null,scanner=null,scannerRunning=false;

const $=id=>document.getElementById(id);
function parseQR(raw){
  const text=String(raw||'').trim();
  if(!text) throw Error('No QR data found.');

  // The actual labels can arrive from iPhone as one continuous string,
  // without visible # separators. Parse by the field identifiers themselves.
  const clean=text.replace(/[\x00-\x1F\x7F]/g,'#').replace(/#+/g,'#');
  const out={raw:text};

  // Internal ID is the leading value before the first P field.
  const firstP=clean.search(/(?:^|#)P(?!1P)/);
  if(firstP>=0){
    const prefix=clean.slice(0,firstP).replace(/^#+/,'').trim();
    if(prefix) out.internalId=prefix;
  } else {
    const m=clean.match(/^(\d{4,})/);
    if(m) out.internalId=m[1];
  }

  // Parse the primary fields by their identifiers, even when separators are missing.
  const pMatch=clean.match(/(?:^|#)P(?!1P)(.*?)(?=Q|9D|1T|1V|1P|$)/);
  const qMatch=clean.match(/Q(.*?)(?=9D|1T|1V|1P|$)/);
  const dMatch=clean.match(/9D(.*?)(?=1T|1V|1P|$)/);
  const tMatch=clean.match(/1T(.*?)(?=1V|1P|$)/);
  const vMatch=clean.match(/1V(.*?)(?=1P|$)/);
  const p1Match=clean.match(/1P(.*)$/);

  if(pMatch) out.partNumber=pMatch[1].replace(/^#+/,'').trim();
  if(qMatch) out.quantity=qMatch[1].replace(/^#+/,'').trim();
  if(dMatch) out.dateCode=dMatch[1].replace(/^#+/,'').trim();
  if(tMatch) out.lot=tMatch[1].replace(/^#+/,'').trim();
  if(vMatch) out.manufacturer=vMatch[1].replace(/^#+/,'').trim();
  if(p1Match) out.partNumber2=p1Match[1].replace(/^#+/,'').trim();

  // If the primary P field was not detected, use the 1P field.
  out.partNumber=out.partNumber||out.partNumber2||'';

  if(out.quantity!==undefined && out.quantity!=='' && !/^\d+(?:\.\d+)?$/.test(out.quantity))
    throw Error('Quantity field Q is not numeric.');

  if(!out.internalId && !out.partNumber)
    throw Error('QR format not recognized.');

  return out;
}
function show(d){
  current=d;
  $('internalId').textContent=d.internalId||'—';
  $('partNumber').textContent=d.partNumber||'—';
  $('qty').textContent=d.quantity??'—';
  $('dateCode').textContent=d.dateCode||'—';
  $('lot').textContent=d.lot||'—';
  $('manufacturer').textContent=d.manufacturer||'—';
  $('details').classList.remove('hidden');
  $('location').focus();
}
function render(){
  $('count').textContent=`${scans.length} scan${scans.length===1?'':'s'}`;
  $('empty').classList.toggle('hidden',scans.length>0);
  $('history').classList.toggle('hidden',scans.length===0);
  $('rows').innerHTML='';
  [...scans].reverse().forEach(s=>{
    const tr=document.createElement('tr');
    [s.time,s.partNumber||'—',s.quantity??'—',s.location||'—',s.manufacturer||'—'].forEach(v=>{
      const td=document.createElement('td');td.textContent=v;tr.appendChild(td);
    });
    $('rows').appendChild(tr);
  });
}
function saveState(){localStorage.setItem('qrInventoryScans',JSON.stringify(scans));render();}
function stopCamera(){
  if(scanner && scannerRunning){
    scanner.stop().catch(()=>{}).finally(()=>{
      scannerRunning=false;
      $('cameraBox').classList.add('hidden');
      $('start').classList.remove('hidden');
      $('stop').classList.add('hidden');
      $('cameraMsg').textContent='Camera stopped.';
    });
  } else {
    $('cameraBox').classList.add('hidden');
    $('start').classList.remove('hidden');
    $('stop').classList.add('hidden');
  }
}
async function startCamera(){
  if(!window.Html5Qrcode){
    $('cameraMsg').textContent='Scanner is still loading. Please wait a moment and try again.';
    return;
  }
  try{
    if(scannerRunning)return;
    $('cameraMsg').textContent='Starting camera...';
    $('cameraBox').classList.remove('hidden');
    $('video').innerHTML='';
    scanner=new Html5Qrcode("video");
    const config={
      fps:10,
      qrbox:{width:250,height:250},
      aspectRatio:1.0,
      disableFlip:false
    };
    await scanner.start(
      {facingMode:{exact:"environment"}},
      config,
      decodedText=>{
        $('raw').value=decodedText;
        try{
          show(parseQR(decodedText));
          $('cameraMsg').textContent='QR code scanned. Review the fields below and enter the location.';
          stopCamera();
        }catch(e){
          $('cameraMsg').textContent=e.message;
        }
      },
      ()=>{}
    );
    scannerRunning=true;
    $('start').classList.add('hidden');
    $('stop').classList.remove('hidden');
    $('cameraMsg').textContent='Camera is on. Point the rear camera at your QR code.';
  }catch(e){
    console.error(e);
    scannerRunning=false;
    $('cameraBox').classList.add('hidden');
    $('start').classList.remove('hidden');
    $('stop').classList.add('hidden');
    $('cameraMsg').textContent='Camera permission was granted, but the preview could not start. Please reload the page and try again.';
  }
}
$('read').onclick=()=>{
  try{show(parseQR($('raw').value));$('cameraMsg').textContent='QR data recognized.'}
  catch(e){$('cameraMsg').textContent=e.message}
};
$('start').onclick=startCamera;
$('stop').onclick=stopCamera;
$('next').onclick=()=>{
  stopCamera();current=null;$('details').classList.add('hidden');$('raw').value='';$('location').value='';$('notes').value='';
  setTimeout(startCamera,200);
};
$('save').onclick=()=>{
  if(!current)return;
  const loc=$('location').value.trim();
  if(!loc){alert('Please enter a location.');$('location').focus();return;}
  scans.push({
    scanId:String(Date.now()),qrCode:current.raw,internalId:current.internalId||'',
    partNumber:current.partNumber||'',quantity:current.quantity!==undefined?Number(current.quantity):'',
    dateCode:current.dateCode||'',lot:current.lot||'',manufacturer:current.manufacturer||'',
    location:loc,notes:$('notes').value.trim(),time:new Date().toLocaleString()
  });
  saveState();current=null;$('details').classList.add('hidden');$('raw').value='';$('location').value='';$('notes').value='';
  $('cameraMsg').textContent='Inventory saved. Ready for the next item.';
};
$('clear').onclick=()=>{
  if(confirm('Delete all saved scans on this device?')){scans=[];saveState();}
};
$('export').onclick=()=>{
  if(!scans.length){alert('No scans to export.');return;}
  const header=['Scan ID','QR Code','Internal ID','Part Number','Quantity','Date Code','Lot','Manufacturer','Location','Date/Time','Notes'];
  const esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';
  const csv=[header.map(esc).join(',')].concat(
    scans.map(s=>[s.scanId,s.qrCode,s.internalId,s.partNumber,s.quantity,s.dateCode,s.lot,s.manufacturer,s.location,s.time,s.notes].map(esc).join(','))
  ).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='QR_Inventory_Scans.csv';a.click();URL.revokeObjectURL(a.href);
};
$('testBtn')?.addEventListener('click',()=>{
  $('raw').value=TEST;
  try{show(parseQR(TEST));$('cameraMsg').textContent='Test QR recognized.'}catch(e){$('cameraMsg').textContent=e.message}
});
$('raw').value=TEST;
render();
</script>
