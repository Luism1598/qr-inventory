<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cff">
<title>QR Inventory</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--blue:#0b5cff;--dark:#102033;--muted:#64748b;--line:#dbe3ee;--bg:#f5f7fb;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--dark)}
header{background:var(--blue);color:#fff;padding:18px 16px;font-size:21px;font-weight:700}
main{max-width:760px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
button,input,textarea{font:inherit}button{min-height:46px;border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:white}.secondary{background:#eef3fb;color:var(--dark)}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:6px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0}
video{width:100%;border-radius:14px;background:#111;display:block;max-height:420px;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.value{font-weight:700;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:13px}.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}.actions{display:flex;flex-wrap:wrap;gap:8px}.success{padding:10px;border-radius:10px;background:#eaf8ee;color:#176b32;font-weight:700}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>QR INVENTORY</header>
<main>
<section class="card">
  <h2>Scan Inventory</h2>
  <p class="muted">Point your phone camera at a QR code. The app extracts your part information automatically.</p>
  <video id="video" class="hidden" autoplay muted playsinline></video>
  <div class="actions">
    <button id="start" class="primary">📷 Start Camera</button>
    <button id="stop" class="secondary hidden">Stop Camera</button>
  </div>
  <p id="cameraMsg" class="muted"></p>
  <label>QR value (manual fallback)
    <textarea id="raw" rows="3" placeholder="K108575#P1021-0150#Q305#9D2329#1T2329#1VYAGEO#1P1021-0150"></textarea>
  </label>
  <button id="read" class="primary">Read QR Data</button>
</section>

<section id="details" class="card hidden">
  <h2>Scan Result</h2>
  <div class="grid">
    <div><span class="muted">Internal ID</span><div id="internalId" class="value">—</div></div>
    <div><span class="muted">Part Number</span><div id="partNumber" class="value">—</div></div>
    <div><span class="muted">Quantity</span><div id="qty" class="value">—</div></div>
    <div><span class="muted">Date Code</span><div id="dateCode" class="value">—</div></div>
    <div><span class="muted">Lot</span><div id="lot" class="value">—</div></div>
    <div><span class="muted">Manufacturer</span><div id="manufacturer" class="value">—</div></div>
  </div>
  <label>Location *
    <input id="location" placeholder="Example: A-01-03" autocomplete="off">
  </label>
  <label>Notes
    <input id="notes" placeholder="Optional">
  </label>
  <div class="actions">
    <button id="save" class="primary">💾 Save Inventory</button>
    <button id="next" class="secondary">📷 Scan Next</button>
  </div>
</section>

<section class="card">
  <h2>Inventory History</h2>
  <div class="actions">
    <button id="export" class="primary">📊 Export Excel</button>
    <button id="clear" class="secondary">Clear History</button>
  </div>
  <p id="count" class="muted">0 scans</p>
  <div id="empty" class="muted">No scans saved yet.</div>
  <div id="history" class="scroll hidden">
    <table><thead><tr><th>Date/Time</th><th>Part</th><th>Qty</th><th>Location</th><th>Manufacturer</th></tr></thead>
    <tbody id="rows"></tbody></table>
  </div>
</section>
</main>

<script>
const TEST='K108575#P1021-0150#Q305#9D2329#1T2329#1VYAGEO#1P1021-0150';
let scans=JSON.parse(localStorage.getItem('qrInventoryScans')||'[]');
let current=null,stream=null,scanLoop=null;

const $=id=>document.getElementById(id);
function parseQR(raw){
  const text=String(raw||'').trim();
  if(!text) throw Error('No QR data found.');
  const out={raw:text};
  for(const part of text.split('#').map(x=>x.trim()).filter(Boolean)){
    if(part.startsWith('9D')) out.dateCode=part.slice(2);
    else if(part.startsWith('1T')) out.lot=part.slice(2);
    else if(part.startsWith('1V')) out.manufacturer=part.slice(2);
    else if(part.startsWith('1P')) out.partNumber2=part.slice(2);
    else if(part.startsWith('K')) out.internalId=part.slice(1);
    else if(part.startsWith('P')) out.partNumber=part.slice(1);
    else if(part.startsWith('Q')) out.quantity=part.slice(1);
  }
  out.partNumber=out.partNumber||out.partNumber2||'';
  if(out.quantity && !/^\d+(\.\d+)?$/.test(out.quantity)) throw Error('Quantity field Q is not numeric.');
  if(!out.internalId && !out.partNumber) throw Error('QR format not recognized.');
  return out;
}
function show(d){
  current=d;
  $('internalId').textContent=d.internalId||'—';
  $('partNumber').textContent=d.partNumber||'—';
  $('qty').textContent=d.quantity??'—';
  $('dateCode').textContent=d.dateCode||'—';
  $('lot').textContent=d.lot||'—';
  $('manufacturer').textContent=d.manufacturer||'—';
  $('details').classList.remove('hidden');
  $('location').focus();
}
function render(){
  $('count').textContent=`${scans.length} scan${scans.length===1?'':'s'}`;
  $('empty').classList.toggle('hidden',scans.length>0);
  $('history').classList.toggle('hidden',scans.length===0);
  $('rows').innerHTML='';
  [...scans].reverse().forEach(s=>{
    const tr=document.createElement('tr');
    [s.time,s.partNumber||'—',s.quantity??'—',s.location||'—',s.manufacturer||'—'].forEach(v=>{
      const td=document.createElement('td');td.textContent=v;tr.appendChild(td);
    });
    $('rows').appendChild(tr);
  });
}
function saveState(){localStorage.setItem('qrInventoryScans',JSON.stringify(scans));render();}
$('read').onclick=()=>{try{show(parseQR($('raw').value));$('cameraMsg').textContent='QR data recognized.'}catch(e){$('cameraMsg').textContent=e.message}};
$('start').onclick=async()=>{
  if(!('BarcodeDetector' in window)){ $('cameraMsg').textContent='Live camera scanning is not supported by this browser. Use Chrome on Android, or use the manual QR-value field below.'; return; }
  try{
    const supported=await BarcodeDetector.getSupportedFormats();
    if(!supported.includes('qr_code')) throw Error('This browser does not report QR-code support.');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    $('video').srcObject=stream;$('video').classList.remove('hidden');$('start').classList.add('hidden');$('stop').classList.remove('hidden');
    $('cameraMsg').textContent='Point the camera at the QR code.';
    const detector=new BarcodeDetector({formats:['qr_code']});
    const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
    const tick=async()=>{
      if(!stream)return;
      if($('video').readyState>=2){
        canvas.width=$('video').videoWidth;canvas.height=$('video').videoHeight;
        if(canvas.width){
          ctx.drawImage($('video'),0,0,canvas.width,canvas.height);
          try{
            const codes=await detector.detect(canvas);
            if(codes.length && codes[0].rawValue){
              $('raw').value=codes[0].rawValue; show(parseQR(codes[0].rawValue));
              stopCamera(); $('cameraMsg').textContent='QR code scanned successfully.';
              return;
            }
          }catch{}
        }
      }
      scanLoop=requestAnimationFrame(tick);
    };
    scanLoop=requestAnimationFrame(tick);
  }catch(e){$('cameraMsg').textContent='Camera could not start. Make sure camera permission is allowed and the app is opened over HTTPS.';}
};
function stopCamera(){
  if(scanLoop)cancelAnimationFrame(scanLoop);scanLoop=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $('video').classList.add('hidden');$('start').classList.remove('hidden');$('stop').classList.add('hidden');
}
$('stop').onclick=stopCamera;
$('next').onclick=()=>{current=null;$('details').classList.add('hidden');$('raw').value='';$('location').value='';$('notes').value='';$('start').click()};
$('save').onclick=()=>{
  if(!current)return;
  const loc=$('location').value.trim(); if(!loc){alert('Please enter a location.');$('location').focus();return;}
  scans.push({
    scanId:String(Date.now()),qrCode:current.raw,internalId:current.internalId||'',
    partNumber:current.partNumber||'',quantity:current.quantity!==undefined?Number(current.quantity):'',
    dateCode:current.dateCode||'',lot:current.lot||'',manufacturer:current.manufacturer||'',
    location:loc,notes:$('notes').value.trim(),time:new Date().toLocaleString()
  });
  saveState(); current=null;$('details').classList.add('hidden');$('raw').value='';$('location').value='';$('notes').value='';
  $('cameraMsg').textContent='Inventory saved. Ready for the next item.';
};
$('clear').onclick=()=>{if(confirm('Delete all saved scans on this device?')){scans=[];saveState();}};
$('export').onclick=()=>{
  if(!scans.length){alert('No scans to export.');return;}
  const header=['Scan ID','QR Code','Internal ID','Part Number','Quantity','Date Code','Lot','Manufacturer','Location','Date/Time','Notes'];
  const esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';
  const csv=[header.map(esc).join(',')].concat(scans.map(s=>[s.scanId,s.qrCode,s.internalId,s.partNumber,s.quantity,s.dateCode,s.lot,s.manufacturer,s.location,s.time,s.notes].map(esc).join(','))).join('\\r\\n');
  const blob=new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='QR_Inventory_Scans.csv';a.click();URL.revokeObjectURL(a.href);
};
$('raw').value=TEST;render();
</script>
</body></html>
